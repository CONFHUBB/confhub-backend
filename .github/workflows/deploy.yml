name: Deploy Backend

on:
  push:
    branches: [ main, feature/conference ]

jobs:
  deploy:
    strategy:
      matrix:
        server: [server-110, server-111]
      fail-fast: false
    runs-on: [self-hosted, '${{ matrix.server }}']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Firebase credentials
        run: |
          mkdir -p src/main/resources
          cp /state/partition1/devops/CONFMSA-GSP26SE76/secrets/firebase-adminsdk.json \
             src/main/resources/filestorage-71871-firebase-adminsdk-fbsvc-7ba8487811.json

      - name: Copy .env secrets
        run: |
          cp /state/partition1/devops/CONFMSA-GSP26SE76/secrets/backend.env .env

      - name: Detect server IP for environment config
        run: |
          SERVER_IP=$(hostname -I | awk '{print $1}')
          echo "Detected server IP: ${SERVER_IP}"
          # Append dynamic server-specific overrides to .env
          # NOTE: DB_HOST is NOT overridden — both servers share the DB on 110
          echo "" >> .env
          echo "# Auto-detected by CI/CD" >> .env
          echo "APP_FRONTEND_URL=http://${SERVER_IP}:4000" >> .env
          echo "APP_BASE_URL=http://${SERVER_IP}:8080" >> .env
          echo "VNPAY_RETURN_URL=http://${SERVER_IP}:8080/api/v1/payment/vnpay-callback" >> .env

      - name: Clean Docker build cache
        run: docker builder prune -af

      - name: Build and Deploy via Docker Compose
        run: |
          # Dừng và xoá container cũ nếu có
          docker rm -f confhub-backend || true
          docker compose down || true
          
          # Build một jar và docker image mới tinh (không lưu cache mã nguồn)
          docker compose build --no-cache
          
          # Đưa ứng dụng vào chạy ngầm ở port 8080 host
          docker compose up -d

      - name: Clean up unused docker data
        run: docker image prune -f

      - name: Health Check
        run: |
          echo "Waiting for Spring Boot container to become healthy..."
          MAX_WAIT=120
          INTERVAL=5
          ELAPSED=0
          until curl -sf http://localhost:8080/v3/api-docs > /dev/null 2>&1; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Health check failed after ${MAX_WAIT}s"
              echo "--- Container status ---"
              docker ps -a --filter name=confhub-backend
              echo "--- Container logs (last 100 lines) ---"
              docker logs --tail 100 confhub-backend 2>&1 || true
              exit 1
            fi
            echo "  ⏳ Waiting... (${ELAPSED}s / ${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "✅ Spring Boot is healthy (took ~${ELAPSED}s)"
