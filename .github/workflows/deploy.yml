name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    strategy:
      matrix:
        server: [server-110, server-111]
      fail-fast: false
    runs-on: [self-hosted, '${{ matrix.server }}']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Firebase credentials
        run: |
          mkdir -p src/main/resources
          cp /state/partition1/devops/secrets/firebase-adminsdk.json \
             src/main/resources/filestorage-71871-firebase-adminsdk-fbsvc-7ba8487811.json

      - name: Detect server IP for environment config
        run: |
          SERVER_IP=$(hostname -I | awk '{print $1}')
          echo "Detected server IP: ${SERVER_IP}"
          echo "APP_FRONTEND_URL=http://${SERVER_IP}:4000" >> $GITHUB_ENV
          echo "APP_BASE_URL=http://${SERVER_IP}:8080" >> $GITHUB_ENV
          echo "VNPAY_RETURN_URL=http://${SERVER_IP}:8080/api/v1/payment/vnpay-callback" >> $GITHUB_ENV
          echo "DB_HOST=${SERVER_IP}" >> $GITHUB_ENV

      - name: Build and Deploy via Docker Compose
        run: |
          # Export env vars so docker compose can use them
          export APP_FRONTEND_URL=${{ env.APP_FRONTEND_URL }}
          export APP_BASE_URL=${{ env.APP_BASE_URL }}
          export VNPAY_RETURN_URL=${{ env.VNPAY_RETURN_URL }}
          export DB_HOST=${{ env.DB_HOST }}
          
          # Dừng và xoá container cũ nếu có
          docker rm -f confhub-backend || true
          docker compose down || true
          
          # Build một jar và docker image mới tinh (không lưu cache mã nguồn)
          docker compose build --no-cache
          
          # Đưa ứng dụng vào chạy ngầm ở port 8080 host
          docker compose up -d

      - name: Clean up unused docker data
        run: docker image prune -f

      - name: Health Check
        run: |
          echo "Waiting 30 seconds for Spring Boot container to initialize..."
          sleep 30
          curl -f http://localhost:8080/v3/api-docs || exit 1
