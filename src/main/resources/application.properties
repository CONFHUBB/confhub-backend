spring.application.name=confhub

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:192.168.88.110}:${DB_PORT:5433}/${DB_NAME:confhub_db}
spring.datasource.username=${DB_USERNAME:confhub_user}
spring.datasource.password=${DB_PASSWORD:StrongPass123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
