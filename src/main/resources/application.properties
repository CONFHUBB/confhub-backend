spring.application.name=confhub

# Datasource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:confhub_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Google OAuth Configuration
app.google.client-id=${GOOGLE_CLIENT_ID:}

## SQL Init (seed data)
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

# Spring Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App URLs
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# File upload configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# VNPAY Configuration
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.secret-key=${VNPAY_SECRET_KEY:}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay-callback}
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# Gemini AI Configuration (multiple keys for rate-limit rotation)
gemini.api-keys=${GEMINI_API_KEYS:}
gemini.model=gemini-2.5-flash
gemini.max-output-tokens=2048

# AI Rate Limiting
ai.rate-limit.max-chat-per-minute=10
ai.rate-limit.max-analysis-per-day=20

# Google Custom Search API (for plagiarism web search)
google.search.api-key=${GOOGLE_SEARCH_API_KEY:}
google.search.engine-id=${GOOGLE_SEARCH_ENGINE_ID:}